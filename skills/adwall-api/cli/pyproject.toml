[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adwall-cli"
version = "1.0.0"
description = "Agent-first CLI for the official AdWall Agent REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yellow Web" }]
keywords = ["adwall", "cli", "advertising", "creatives", "rest", "api"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
adwall = "adwall_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adwall_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
